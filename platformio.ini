[env:cyd]
; Pinned for reproducible release builds. 6.12.0 == arduino-esp32 2.0.17.
; Unpinned resolves to the pioarduino 55.x fork (arduino-esp32 3.x).
platform      = espressif32@6.12.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800
board_build.partitions = partitions_custom.csv
; Writes flash_parts.json + firmware-merged.bin for the web installer.
extra_scripts = post:tools/merge_bin.py
custom_installer_label = CYD 2.8″ – ESP32-2432S028R
custom_installer_hint  = The classic Cheap Yellow Display: 2.8″ 320×240 screen.

lib_deps =
    bodmer/TFT_eSPI@^2.4.76
    ropg/ezTime
    tzapu/WiFiManager
    bblanchon/ArduinoJson@^6.21.0

build_flags =
    ; ---- TFT_eSPI CYD display config ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTOUCH_CS=33
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; ---- Debug ----
    -DDEBUG_LEVEL=3
    -DCORE_DEBUG_LEVEL=0
